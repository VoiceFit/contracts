name: ci

on:
  pull_request:
  push:
    branches: [main]
  # 권한·시크릿을 고친 뒤 손으로 다시 돌릴 수 있게 열어 둔다
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # 생성물(dist·json-schema)이 Zod 원본과 어긋나면 소비자가 다른 계약을 믿게 된다
      - run: pnpm export:json-schema
      - run: git diff --exit-code -- json-schema
